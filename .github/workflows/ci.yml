name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Syntax and signature checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check Node.js
        run: |
          for file in examples/js/*.mjs scripts/sync-openapi; do node --check "$file"; done
          node examples/js/sign-request.mjs
      - name: Check PHP
        run: |
          for file in examples/php/*.php; do php -l "$file"; done
          php examples/php/sign-request.php
      - name: Check Python
        run: |
          python -m py_compile examples/python/*.py
          python examples/python/sign-request.py

  openapi:
    name: Compare with live OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/sync-openapi
      - run: git diff --exit-code -- openapi/openapi.json openapi/openapi.yaml
